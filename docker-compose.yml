services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taptag-backend:dev
    working_dir: /app
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    profiles:
      - backend
    command: npm run seed:knowledge

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taptag-backend:dev
    working_dir: /app
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    profiles:
      - api
    command: npm start

  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taptag-backend:dev
    working_dir: /app
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    profiles:
      - tools
    command: npm run seed:knowledge

  backend-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taptag-backend:dev
    working_dir: /app
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    profiles:
      - tools
    command: npm run cleanup:knowledge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taptag-frontend:dev
    working_dir: /app
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Never let Expo CLI block Metro on its interactive account prompt when
      # a device connects; see frontend/scripts/start-expo.sh for details.
      EXPO_OFFLINE: "1"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      # For real-device testing from Docker, override this with your host LAN/Tailscale IP:
      # REACT_NATIVE_PACKAGER_HOSTNAME: "192.168.x.x"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    profiles:
      - frontend
    command: npm start -- --lan

volumes:
  backend_node_modules:
  frontend_node_modules:
